name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies and Lint Frontend
      run: |
        cd frontend
        npm install
        npm run lint

  build:
    needs: lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Frontend
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-task-frontend:latest

    - name: Build and push Backend
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-task-backend:latest

    - name: Build and push Worker
      uses: docker/build-push-action@v4
      with:
        context: ./worker
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-task-worker:latest

    - name: Update Kubernetes manifests
      run: |
        git clone https://${{ secrets.GH_PAT }}@github.com/${{ github.repository_owner }}/ai-task-platform-infra.git infra-repo

        cd infra-repo

        sed -i 's|image: .*ai-task-frontend.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/ai-task-frontend:latest|g' kubernetes/frontend.yaml

        sed -i 's|image: .*ai-task-backend.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/ai-task-backend:latest|g' kubernetes/backend.yaml

        sed -i 's|image: .*ai-task-worker.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/ai-task-worker:latest|g' kubernetes/worker.yaml

        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

        git add .

        git commit -m "Update latest image tags" || echo "No changes to commit"

        git push origin main
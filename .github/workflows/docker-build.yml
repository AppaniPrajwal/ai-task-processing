name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Backend Image
      run: |
        docker build -t prajwal1050/backend:latest ./backend

    - name: Build Frontend Image
      run: |
        docker build -t prajwal1050/frontend:latest ./frontend

    - name: Build Worker Image
      run: |
        docker build -t prajwal1050/worker:latest ./worker

    - name: Push Backend Image
      run: docker push prajwal1050/backend:latest

    - name: Push Frontend Image
      run: docker push prajwal1050/frontend:latest

    - name: Push Worker Image
      run: docker push prajwal1050/worker:latest